<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 1150" font-family="Helvetica, Arial, sans-serif">
  <rect width="1120" height="1150" fill="#ffffff"/>

  <!-- Principles: the frame every layer stands in -->
  <circle cx="560" cy="560" r="530" fill="#ECE9E2" stroke="#8C8577" stroke-width="1.5"/>
  <defs>
    <path id="principlesTop" d="M 65 560 A 495 495 0 0 1 1055 560"/>
    <path id="principlesBottom" d="M 50 560 A 510 510 0 0 0 1070 560"/>
  </defs>
  <text font-size="13" fill="#4A443A">
    <textPath xlink:href="#principlesTop" href="#principlesTop" startOffset="50%" text-anchor="middle"><tspan font-weight="bold">PRINCIPLES</tspan>  ·  Accountability · Independence · Honesty · Knowledge outside the model · Given context · Shared, not personal · Adaptation</textPath>
  </text>
  <text font-size="12" fill="#4A443A">
    <textPath xlink:href="#principlesBottom" href="#principlesBottom" startOffset="50%" text-anchor="middle">Never tailored  ·  hold in every layer, at every level of adoption</textPath>
  </text>

  <g transform="translate(60,60)">

