    <path d="M 41.8 395.4 A 470 470 0 0 1 296.1 76.5 L 342.9 173.8 A 362 362 0 0 0 147.1 419.5 Z"/>
  </g>
  <circle cx="500" cy="500" r="470" fill="none" stroke="#2F4A73" stroke-width="2"/>

